# Development infrastructure: PostgreSQL (app DB) + Redis.
# Traccar is added in Milestone 2. Dev-only credentials below; production uses secrets from the environment.
name: gps-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev}
      GPS_OWNER_PASSWORD: ${GPS_OWNER_PASSWORD:-gps_owner_dev}
      GPS_APP_PASSWORD: ${GPS_APP_PASSWORD:-gps_app_dev}
      GPS_SYSTEM_PASSWORD: ${GPS_SYSTEM_PASSWORD:-gps_system_dev}
      TRACCAR_DB_PASSWORD: ${TRACCAR_DB_PASSWORD:-traccar_dev}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:63799:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # GPS engine. Image tag is PINNED (never `latest`): API behaviour is verified against this exact version.
  # Verified/pinned 2026-11-01 — see docs/GPS_INTEGRATION.md. Own database `traccar` on the shared server.
  traccar:
    image: traccar/traccar:6.16.0-debian
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACCAR_DB_PASSWORD: ${TRACCAR_DB_PASSWORD:-traccar_dev}
      CONFIG_USE_ENVIRONMENT_VARIABLES: 'true'
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://postgres:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${TRACCAR_DB_PASSWORD:-traccar_dev}
      # Devices are registered ONLY through our onboarding flow, never auto-created by connecting.
      DATABASE_REGISTER_UNKNOWN: 'false'
      # Addresses/coordinates are not sent to a third-party geocoder; we geocode through our own port.
      GEOCODER_ENABLE: 'false'
      # Position filtering (verified against 6.16.0, see docs/GPS_INTEGRATION.md):
      # a fix timestamped in the future becomes the device's 'latest' and silently stops all later live
      # pushes, and Traccar's default tolerance is 24 h. Allow 10 min of clock skew, drop the rest.
      # filter.zero / filter.invalid stay OFF on purpose: those records are heartbeats that our pipeline
      # must still see (a vehicle in a tunnel is not offline).
      FILTER_ENABLE: 'true'
      FILTER_FUTURE: '600'
    ports:
      # DEV ONLY and localhost-bound so the host-run API can reach it. In production port 8082 is internal.
      - '127.0.0.1:58082:8082'
      # OsmAnd protocol (simulator). Real protocol ports are added per device model (docs/GPS_INTEGRATION.md).
      - '127.0.0.1:55055:5055'
    healthcheck:
      # The image has no curl/wget: probe the API with bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8082 && printf "GET /api/server HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
  redisdata:
